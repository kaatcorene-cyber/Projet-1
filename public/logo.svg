<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 56" fill="none">
  <!-- Minimalist Clean CargillCi Logo avec CI collé -->
  
  <!-- Modern Leaf Accent Mark -->
  <g transform="translate(6, 10)">
    <!-- Main stylized organic leaf -->
    <path 
      d="M 18 34 C 18 20 28 8 36 4 C 36 18 28 30 18 34 Z" 
      fill="#059669" 
    />
    <!-- Secondary soft curved leaf -->
    <path 
      d="M 18 34 C 18 25 10 18 4 15 C 4 25 12 32 18 34 Z" 
      fill="#10b981" 
    />
    <!-- Small natural warm dot representing growth/sun -->
    <circle cx="20" cy="5" r="3.5" fill="#f97316" />
  </g>

  <!-- Typography with "CI" tightly attached / seamless -->
  <text 
    x="56" 
    y="36" 
    font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" 
    font-size="28" 
    font-weight="800" 
    fill="#111827" 
    letter-spacing="-0.5"
  >Cargill<tspan fill="#059669" font-weight="900">CI</tspan></text>
</svg>
